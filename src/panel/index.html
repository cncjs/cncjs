<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!--
      No zoom, and the notch included.

      `user-scalable=no` is normally a thing to be talked out of — pinch-zoom
      is how people with poor sight read a page. This is not a page: it is a
      control surface for a machine that moves, gripped in one hand beside a
      spindle, and an accidental pinch that leaves the jog keys half off the
      screen is worse than the problem it solves. The panel answers the same
      need properly instead, by having a density setting and a type scale that
      follows the format.

      `viewport-fit=cover` so the frame reaches under a notch rather than
      leaving the system's letterbox colour in the corners of a fullscreen app.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

    <title>CNCjs Panel</title>

    <link rel="manifest" href="/panel/manifest.webmanifest">
    <link rel="icon" href="/panel/icons/favicon.svg" type="image/svg+xml">

    <!--
      iOS reads none of the manifest. Both of these are how an iPhone learns
      it is installing an application rather than bookmarking a page, and the
      icon has to be a PNG at a literal path.
    -->
    <link rel="apple-touch-icon" href="/panel/icons/apple-touch-icon.png">
    <!--
      The same declaration Android reads, beside the one iOS reads.

      Without it Chrome falls back to its own defaults for a page opened from
      the home screen, which is a browser tab with a toolbar — and a toolbar
      that slides in and out is the thing this panel spends its layout rules
      trying not to be moved by.
    -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Panel">
    <!--
      Translucent so the status bar takes the panel's own background instead
      of a black band above it — which is what `viewport-fit=cover` above is
      there to fill.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!--
      One tag, and JavaScript keeps it in step.

      `theme_color` paints the system bars around an installed app and the
      panel has a light theme and a dark one, so this began as a pair keyed on
      `prefers-color-scheme`. That was wrong twice over. The panel has no
      system-following theme at all -- `[data-theme='dark']` in the token
      sheet is the only thing that switches it -- so a tag keyed on the
      phone's preference promised something the panel does not do. And with
      several tags a browser uses the *first* whose media matches, so a tag
      added later by script could never win: on a phone in dark mode the
      status bar stayed dark above a white panel, after a reinstall, measured.

      So: one tag, the light value for the moment before the bundle runs, and
      `ui/themeColor` rewrites its content from `--panel` from then on.
    -->
    <meta id="theme-color-live" name="theme-color" content="#ffffff">
  </head>
  <body>
    <div id="panel-root"></div>
    <%= htmlWebpackPlugin.options.reviewLoader || '' %>
  </body>
</html>
