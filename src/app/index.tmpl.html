<!doctype html>
<html dir={{dir}} lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<title>{{title}}</title>
<meta name="description" content="">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>
(function () {
  var appearance;
  try {
    var stored = JSON.parse(localStorage.getItem('cnc'));
    appearance = stored && stored.state && stored.state.settings && stored.state.settings.appearance;
  } catch (error) {
    // Unavailable or invalid storage must not prevent the loading screen.
  }
  var isDark = appearance === 'dark' ||
    (appearance !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-color-scheme', isDark ? 'dark' : 'light');
})();
</script>
<style>
html {
  background-color: {{lightBackground}};
  color-scheme: light;
}
html[data-color-scheme="dark"] {
  background-color: {{darkBackground}};
  color-scheme: dark;
}
#loading { color: {{lightText}}; }
html[data-color-scheme="dark"] #loading { color: {{darkText}}; }
</style>
<link rel="shortcut icon" href="{{webroot}}favicon.ico">
</head>
<body>
<script>
this.process = Object.assign({}, this.process, { env: {} });
</script>
<div id="loading" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
  {{spinner}}
  <div style="font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: normal; color: inherit; text-align: center; margin-top: 10px;">{{loading}}</div>
</div>
</body>
</html>
