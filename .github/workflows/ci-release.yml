# This workflow will release the packages with Changesets

name: ci-release

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions: {}

jobs:
  release:
    # [IMPORTANT] Prevent this action from running on forks
    if: github.repository == 'cncjs/cncjs'
    permissions:
      actions: write        # to dispatch tag workflows
      contents: write       # to create release (changesets/action)
      issues: write         # to post issue comments (changesets/action)
      pull-requests: write  # to create pull request (changesets/action)
      id-token: write       # to request OIDC token for npm Trusted Publishing
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch the entire Git history to ensure `Changesets` can generate changelogs with the correct commits
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Update npm
        run: npm install -g npm@latest
      - name: Install Dependencies
        run: yarn install
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ env.GITHUB_TOKEN }}
          pr-title: "chore(release): version packages"
          commit-message: "chore(release): version packages"
          version-script: yarn ci-version
          publish-script: yarn ci-publish
        env:
          GITHUB_TOKEN: ${{ env.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          YARN_NPM_PUBLISH_PROVENANCE: true
      - name: Determine published tag
        id: published-tag
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          TAG=$(node -e '
            const packages = JSON.parse(process.env.PUBLISHED_PACKAGES);
            const pkg = packages.find((item) => item.name === "cncjs");
            if (!pkg || !pkg.version) {
              throw new Error("Published cncjs version not found");
            }
            console.log(`v${pkg.version}`);
          ')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Dispatch desktop release
        if: steps.published-tag.outcome == 'success'
        env:
          GH_TOKEN: ${{ env.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.published-tag.outputs.tag }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
      - name: Dispatch Docker release
        if: ${{ !cancelled() && steps.published-tag.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ env.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.published-tag.outputs.tag }}
        run: gh workflow run ci-docker-hub.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
